[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "petrovaradin-info-archive"
version = "0.1.0"
description = "Istorijsko otkrivanje i arhiviranje vesti o Petrovaradinu"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12",
  "httpx>=0.27",
  "PyYAML>=6.0",
  "pypdf>=5.0",
  "selenium>=4.20",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
petrovaradin-archive = "petrovaradin_archive.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
