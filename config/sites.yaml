  - id: "021"
    name: "021.rs"
    domains: ["021.rs", "www.021.rs"]
    enabled: true
    # Generički adapter hvata prvi <article> na strani, a to je "najnovije vesti" teaser
    # widget (ima ih 50+ po strani), ne sam tekst priče. Stvarni sadržaj je u div.story.
    body_selector: "div.story"
    # div.storyBody sadrži ugnježdene widgete koji nisu sam tekst priče: "još iz
    # kategorije" (.moreCategory), oglas (.articleCopyright), komentare čitalaca
    # (.commentsBlock), "najčitanije" (.storyInlineArticles), "dodaj kao izvor" dugme
    # (.bottomShare) i listu tagova na dnu (.tags).
    strip_selectors: [".moreCategory", ".articleCopyright", ".commentsBlock", ".storyInlineArticles", ".bottomShare", ".tags"]
    sitemaps:
      - "https://www.021.rs/sitemap.xml"
    internal_search:
      enabled: true
      engine: selenium
      start_url: "https://www.021.rs/search?q=petrovaradin#gsc.tab=0&gsc.q=petrovaradin&gsc.page=1"
      result_link_css: ".gsc-result a.gs-title, article a[href]"
      next_css: ".gsc-cursor-next-page, a[rel='next'], a.next"
      pagination_mode: gsc
      max_pages: 200

