      result_link_css: "article h2 a, article h3 a, .post-title a"
      next_css: "a.next, a[rel='next']"
      max_pages: 200
      headless: false
      user_data_dir: "data/browser_profiles/buka_6yka"
      challenge_wait_seconds: 120

